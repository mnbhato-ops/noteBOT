name: Auto Note Publisher

on:
  schedule:
    # 毎日 朝7時(22:00 UTC) と 夜19時(10:00 UTC) に自動実行
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch: # 手動で「Run workflow」ボタンからも動かせる設定

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright
        playwright install chromium
        playwright install-deps

    - name: Run Auto Post Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
        NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
      run: |
        python auto_note_gemini.py
